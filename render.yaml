# Render Blueprint: push this file to GitHub, then in Render dashboard choose
# "New +" -> "Blueprint" and point it at this repo. Fields marked `sync: false`
# below are NOT filled automatically — after the Blueprint is created, open
# each service's Environment tab and paste in the real value (OPENAI_API_KEY,
# GMAIL_CLIENT_ID/SECRET/REFRESH_TOKEN, EMAIL_USER, EMAIL_FROM, APP_BASE_URL
# = your onrender.com URL). SECRET_KEY on the cron job should be copied from
# the web service's auto-generated value so both use the same secret.
#
# Render's free Postgres plan expires 30 days after creation (1 GB cap, one
# free DB per workspace). Upgrade the `plan` below before that if you need
# the database to keep running.
databases:
  - name: budget-buddy-db
    databaseName: budget_buddy
    user: budget_buddy
    plan: free

services:
  - type: web
    name: budget-buddy-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: budget-buddy-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false

  # Cron Job services have no free tier on Render; pick a paid plan in the
  # dashboard after the Blueprint is created (or delete this service and run
  # the weekly report manually / from another scheduler).
  - type: cron
    name: budget-buddy-weekly-report
    runtime: python
    schedule: "0 1 * * MON"
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app send-weekly-reports
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: budget-buddy-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
