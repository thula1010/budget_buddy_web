<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Buddy — AI Coach</title>
<script>window.BB_PREFERENCES = {{ app_preferences|tojson }};</script>
<script src="{{ url_for('static', filename='js/preferences.js') }}"></script>
<script src="{{ url_for('static', filename='js/markdown.js') }}"></script>
<script src="{{ url_for('static', filename='js/nav-badges.js', v='20260825-1') }}"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --accent:#0D9488; --accent-2:#14B8A6;
  --text:#334155; --muted:#94A3B8; --border:#E2E8F0;
  --income:#34D399; --expense:#F87171; --ai:#A78BFA;
  --r:16px; --shadow:0 2px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
}
.app{display:flex;min-height:100vh}
/* ---------- Sidebar ---------- */
.sidebar{
  width:250px;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;gap:12px;align-items:center;padding:22px 20px;border-bottom:1px solid var(--border)}
.brand .logo{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 16px rgba(13,148,136,.28);
}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.2px}
.brand span{font-size:12px;color:var(--muted);font-weight:500}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav a{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;
  background:transparent;border-radius:12px;font:inherit;font-size:15px;font-weight:600;
  color:var(--text);text-decoration:none;transition:.18s;border-left:3px solid transparent;
}
.nav a:hover{background:#F1F5F9}
.nav a.active{
  color:var(--accent);border-left-color:var(--accent);
  background:linear-gradient(90deg,rgba(13,148,136,.10),rgba(13,148,136,0));
}
.profile{
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:18px 20px;border-top:1px solid var(--border);
}
.avatar{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  flex-shrink: 0;
}
.logout-btn{
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  padding: 6px; border-radius: 8px; transition: 0.2s;
}
.logout-btn:hover{ color: var(--expense); background: #FEF2F2; }

/* ---------- Main ---------- */
.main{flex:1;min-width:0}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:22px 32px;border-bottom:1px solid var(--border);background:var(--card);
  position:sticky;top:0;z-index:20;
}
.topbar h2{font-size:26px;font-weight:800;letter-spacing:-.4px}
.topbar p{font-size:13px;color:var(--muted);margin-top:2px}
.synced{
  display:flex;align-items:center;gap:8px;background:#F1F5F9;color:var(--text);
  padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;
}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--income);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{
  border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;font-size:14px;
  color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 4px 14px rgba(13,148,136,.28);transition:.18s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(13,148,136,.34)}
.content{padding:26px 32px 60px;display:flex;flex-direction:column;gap:20px}

/* ---------- AI Coach UI ---------- */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:22px;
}
.card h3{font-size:12px;letter-spacing:1.1px;color:var(--muted);font-weight:700;text-transform:uppercase}
.chat-wrap{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;align-items:start}
.chat{display:flex;flex-direction:column;height:560px;padding:0;overflow:hidden}
.chat-workspace{display:grid;grid-template-columns:190px minmax(0,1fr);height:100%;min-height:0}
.chat-history{display:flex;flex-direction:column;min-width:0;padding:14px 11px;border-right:1px solid var(--border);background:#fff}
.chat-history-title{padding:2px 5px 11px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.chat-tabs{display:flex;flex-direction:column;gap:7px;min-height:0;overflow-y:auto;overflow-x:hidden;flex:1;padding:2px;scrollbar-width:thin}
.chat-tab{display:flex;align-items:center;width:100%;border:1px solid var(--border);border-radius:10px;background:#F8FAFC;overflow:hidden;transition:.16s}
.chat-tab.active{background:#F0FDFA;border-color:#5EEAD4;box-shadow:0 0 0 2px rgba(13,148,136,.08)}
.chat-tab-main,.chat-tab-action,.new-chat-btn{border:0;background:transparent;font:inherit;cursor:pointer}
.chat-tab-main{display:flex;align-items:center;gap:7px;min-width:0;flex:1;padding:9px 4px 9px 9px;color:var(--text);font-size:12.5px;font-weight:700;text-align:left}
.chat-tab-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-tab.active .chat-tab-main{color:var(--accent)}
.chat-tab-action{padding:7px 4px;color:var(--muted);font-size:13px;line-height:1;flex:none}
.chat-tab-action:last-child{padding-right:8px;font-size:17px}
.chat-tab-action.rename:hover{color:var(--accent)}
.chat-tab-action.close:hover{color:var(--expense)}
.chat-tab-action:disabled{opacity:.35;cursor:not-allowed}
.chat-title-input{min-width:0;width:100%;margin:4px;padding:6px 7px;border:1px solid var(--accent);border-radius:7px;font:inherit;font-size:12px;color:var(--text);outline:none;background:#fff}
.chat-tab-unread{width:7px;height:7px;border-radius:50%;background:#F43F5E;box-shadow:0 0 0 3px rgba(244,63,94,.10);flex:none}
.new-chat-btn{width:100%;flex:none;margin-bottom:10px;padding:8px 9px;border:1px dashed #5EEAD4;border-radius:10px;color:var(--accent);font-size:12px;font-weight:800;white-space:nowrap}
.new-chat-btn:hover{background:#F0FDFA}
.chat-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:22px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:80%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:13px 17px;border-radius:16px;font-size:14px;line-height:1.55;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg.me .bubble{background:var(--accent);color:#fff;border:0;border-radius:16px;border-bottom-right-radius:5px}
.msg.ai .bubble{min-width:0;overflow-wrap:anywhere}
.msg.ai .bubble p{margin:0 0 9px}
.msg.ai .bubble p:last-child{margin-bottom:0}
.msg.ai .bubble ul,.msg.ai .bubble ol{margin:7px 0 9px;padding-left:21px}
.msg.ai .bubble li{margin:4px 0;padding-left:2px}
.msg.ai .bubble strong{font-weight:800;color:#1E293B}
.msg.ai .bubble em{font-style:italic}
.msg.ai .bubble code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.92em;background:#F1F5F9;padding:2px 5px;border-radius:5px}
.msg.ai .bubble pre{margin:8px 0;padding:10px 12px;overflow:auto;background:#F1F5F9;border-radius:8px;white-space:pre-wrap}
.msg.ai .bubble pre code{padding:0;background:transparent}
.msg.ai .bubble blockquote{margin:8px 0;padding:6px 10px;border-left:3px solid var(--ai);background:#F5F3FF;border-radius:5px}
.msg.pending .bubble{color:var(--muted);font-style:italic}
.mini{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--accent)}
.msg.ai .mini{background:var(--ai)}
.composer{display:flex;gap:10px;padding:16px;background:var(--card);border-top:1px solid var(--border)}
.composer input{flex:1;padding:13px 16px;border:1px solid var(--border);border-radius:12px;font:inherit;font-size:14px}
.composer input:focus{outline:none;border-color:var(--accent)}
.composer .btn:disabled{opacity:.6;cursor:wait;transform:none;box-shadow:none}
.note-item{border-left:3px solid var(--c);background:var(--b);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;font-weight:600;line-height:1.45}
.note-item small{display:block;color:var(--muted);font-weight:500;margin-top:5px;font-size:11.5px}
.qp{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;font:inherit;
  font-size:13.5px;font-weight:600;background:var(--card);border:1px solid var(--border);
  border-radius:11px;cursor:pointer;transition:.16s;
}
.qp:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

@media(max-width:1000px){
  .chat-wrap{grid-template-columns:1fr}
  .sidebar{width:76px}.brand div,.nav a span.lbl,.profile div,.logout-btn{display:none}
}
@media(max-width:620px){
  .chat-workspace{grid-template-columns:145px minmax(0,1fr)}
  .chat-history{padding:10px 7px}
  .chat-tab-action.rename{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">&#128176;</div>
      <div><h1>Budget Buddy</h1><span>&middot; Smart Finance</span></div>
    </div>
    <nav class="nav">
      <a href="/" data-nav-section="overview">&#127968; <span class="lbl">Overview</span></a>
      <a href="transactions" data-nav-section="transactions">&#8596;&#65039; <span class="lbl">Transactions</span></a>
      <a href="budgets" data-nav-section="budgets">&#128202; <span class="lbl">Budgets</span></a>
      <a href="goals" data-nav-section="goals">&#127919; <span class="lbl">Goals</span></a>
      <a href="ai-coach" data-nav-section="ai-coach" class="active">&#10024; <span class="lbl">AI Coach</span></a>
    </nav>
    <div class="profile">
      <div style="display: flex; gap: 12px; align-items: center; min-width: 0;">
        <div class="avatar" id="avatar">{{ user.username[0].upper() }}</div>
        <div style="min-width: 0;">
          <b id="uname" style="font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ user.username }}</b>
          <small id="uplan" style="color: var(--muted); font-size: 12px;">Student</small>
        </div>
      </div>
      <a href="/settings" title="Cài đặt" class="logout-btn" aria-label="Cài đặt">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"></path></svg>
      </a>
      <a href="/logout" title="Đăng xuất" class="logout-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </a>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h2>AI Coach</h2><p>Personal Smart Assistant</p></div>
      <div style="display:flex;gap:12px;align-items:center">
        <div class="synced"><i class="pulse"></i> Synced</div>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<script>
/* ===== UI Script ===== */
const $ = s => document.querySelector(s);
const DISPLAY_NAME = {{ user.username|tojson }};
const MAX_CHAT_TABS = 8;
const CHAT_STORAGE_KEY = `budget-buddy-ai-chats-v1:${DISPLAY_NAME}`;
let S = null;
let conversations = [];
let activeChatId = null;
let nextChatNumber = 1;
let editingChatTitleId = null;
const sendingChats = new Set();
const esc = BBMarkdown.escape;

function welcomeMessage(){
  return {from:'ai', text:BB.text(
    `Hi ${DISPLAY_NAME}! What would you like to review about your finances?`,
    `Chào ${DISPLAY_NAME}! Bạn muốn xem nội dung tài chính nào?`
  )};
}

function createConversation(){
  const number = nextChatNumber++;
  return {
    id:`chat-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
    title:BB.text(`Chat ${number}`, `Cuộc trò chuyện ${number}`),
    messages:[welcomeMessage()],
    draft:'',
    unread:false,
    customTitle:false
  };
}

function loadConversations(){
  try {
    const stored = JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || '{}');
    const rows = Array.isArray(stored.conversations) ? stored.conversations.slice(0, MAX_CHAT_TABS) : [];
    conversations = rows.map((row, index) => ({
      id:typeof row.id === 'string' && row.id ? row.id : `restored-${index}`,
      title:typeof row.title === 'string' && row.title ? row.title.slice(0, 40) : BB.text(`Chat ${index + 1}`, `Cuộc trò chuyện ${index + 1}`),
      messages:Array.isArray(row.messages) ? row.messages.filter(message =>
        message && (message.from === 'ai' || message.from === 'me') && typeof message.text === 'string'
      ).slice(-100).map(message => ({from:message.from, text:message.text, error:Boolean(message.error)})) : [],
      draft:typeof row.draft === 'string' ? row.draft.slice(0, 5000) : '',
      unread:Boolean(row.unread),
      customTitle:Boolean(row.customTitle)
    }));
    conversations.forEach(row => { if(!row.messages.length) row.messages = [welcomeMessage()]; });
    nextChatNumber = Math.max(Number(stored.nextChatNumber) || 1, conversations.length + 1);
    activeChatId = conversations.some(row => row.id === stored.activeChatId) ? stored.activeChatId : conversations[0]?.id;
  } catch(error) {
    conversations = [];
  }
  if(!conversations.length){
    const first = createConversation();
    conversations = [first];
    activeChatId = first.id;
  }
}

function saveConversations(){
  try {
    localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify({
      activeChatId,
      nextChatNumber,
      conversations:conversations.map(row => ({
        id:row.id,
        title:row.title,
        messages:row.messages.filter(message => !message.pending).slice(-100),
        draft:row.draft || '',
        unread:Boolean(row.unread),
        customTitle:Boolean(row.customTitle)
      }))
    }));
  } catch(error) {
    // Chats remain available for the current page when browser storage is unavailable.
  }
}

function activeConversation(){
  return conversations.find(row => row.id === activeChatId) || conversations[0];
}

window.newChat = () => {
  if(conversations.length >= MAX_CHAT_TABS){
    alert(BB.text('You can open up to 8 chat tabs.', 'Bạn có thể mở tối đa 8 tab trò chuyện.'));
    return;
  }
  const conversation = createConversation();
  conversations.push(conversation);
  activeChatId = conversation.id;
  saveConversations();
  render();
  const input = $('#chatInput'); if(input) input.focus();
};

window.switchChat = id => {
  const conversation = conversations.find(row => row.id === id);
  if(!conversation) return;
  activeChatId = id;
  conversation.unread = false;
  saveConversations();
  render();
  const input = $('#chatInput'); if(input) input.focus();
};

window.closeChat = id => {
  const index = conversations.findIndex(row => row.id === id);
  if(index < 0 || sendingChats.has(id)) return;
  const conversation = conversations[index];
  if(conversation.messages.length > 1 && !confirm(BB.text(
    'Close this chat and remove its local history?',
    'Đóng cuộc trò chuyện này và xóa lịch sử trên trình duyệt?'
  ))) return;
  conversations.splice(index, 1);
  if(!conversations.length) conversations.push(createConversation());
  if(activeChatId === id) activeChatId = conversations[Math.min(index, conversations.length - 1)].id;
  saveConversations();
  render();
};

window.startRenameChat = id => {
  if(!conversations.some(row => row.id === id)) return;
  editingChatTitleId = id;
  render();
  setTimeout(() => {
    const input = document.querySelector('.chat-title-input');
    if(input){ input.focus(); input.select(); }
  }, 0);
};

window.saveChatTitle = (id, value) => {
  const conversation = conversations.find(row => row.id === id);
  const title = String(value || '').trim();
  editingChatTitleId = null;
  if(conversation && title){
    conversation.title = title.slice(0, 40);
    conversation.customTitle = true;
    saveConversations();
  }
  render();
};

window.chatTitleKey = (event, input, id) => {
  if(event.key === 'Enter'){
    event.preventDefault();
    saveChatTitle(id, input.value);
  } else if(event.key === 'Escape'){
    event.preventDefault();
    editingChatTitleId = null;
    render();
  }
};

window.updateChatDraft = value => {
  const conversation = activeConversation();
  if(conversation) conversation.draft = value;
};

loadConversations();

async function load(){
  try {
    const r = await fetch('/api/state');
    if(!r.ok) throw new Error('state');
    S = await r.json();
    render();
  } catch(error) {
    $('#view').innerHTML = `<div class="card">${BB.text('Unable to load your financial data. Please refresh the page.', 'Không thể tải dữ liệu tài chính. Vui lòng tải lại trang.')}</div>`;
  }
}

window.addEventListener('focus', () => { if(!sendingChats.size) load(); });

function render(){
  if(!S) return;
  BBNavBadges.update(S);
  $('#uname').textContent = S.user.name; $('#uplan').textContent = S.user.plan; $('#avatar').textContent = S.user.initials;

  const NC = {warn:['#F59E0B','#FFFBEB'], ai:['#A78BFA','#F5F3FF'], done:['#34D399','#ECFDF5']};
  const notes = (S.notifications || []).map(n => {
    const palette = NC[n.kind] || ['#64748B','#F8FAFC'];
    return `<div class="note-item" style="--c:${palette[0]};--b:${palette[1]}">
      ${esc(n.text)}<small>${esc(n.ago)}</small></div>`;
  }).join('');
      
  const prompts = BB.language === 'vi'
    ? ['📊 Tháng này tôi tiêu thế nào?','🎯 Mục tiêu nào gần đạt nhất?','💰 Ngân sách nào sắp vượt?','🏦 Số dư các tài khoản?']
    : ['📊 How is my spending this month?','🎯 Which goal is closest?','💰 Which budget is near its limit?','🏦 What are my account balances?'];
  const promptButtons = prompts
    .map(p => `<button class="qp" onclick="quick(this)">${p}</button>`).join('');

  const conversation = activeConversation();
  const isSending = sendingChats.has(conversation.id);
  const tabs = conversations.map(row => `
    <div class="chat-tab ${row.id===activeChatId?'active':''}" data-chat-id="${esc(row.id)}">
      ${editingChatTitleId===row.id
        ? `<input class="chat-title-input" value="${esc(row.title)}" maxlength="40" onkeydown="chatTitleKey(event,this,this.parentElement.dataset.chatId)" onblur="saveChatTitle(this.parentElement.dataset.chatId,this.value)">`
        : `<button class="chat-tab-main" onclick="switchChat(this.parentElement.dataset.chatId)" title="${esc(row.title)}">
            <span>${esc(row.title)}</span>${row.unread?'<i class="chat-tab-unread" aria-hidden="true"></i>':''}
          </button>
          <button class="chat-tab-action rename" onclick="startRenameChat(this.parentElement.dataset.chatId)" title="${BB.text('Rename chat', 'Đổi tên trò chuyện')}">&#9998;</button>
          <button class="chat-tab-action close" onclick="closeChat(this.parentElement.dataset.chatId)" title="${BB.text('Close chat', 'Đóng trò chuyện')}" ${sendingChats.has(row.id)?'disabled':''}>&times;</button>`}
    </div>`).join('');
  const msgs = conversation.messages.map(m => {
    const content = m.from === 'ai' ? BBMarkdown.render(m.text) : BBMarkdown.renderPlain(m.text);
    return `<div class="msg ${m.from==='me'?'me':'ai'} ${m.pending?'pending':''}">
      <div class="mini">${m.from==='me'?esc(S.user.initials):'✨'}</div>
      <div class="bubble">${content}</div></div>`;
  }).join('');
  $('#view').innerHTML = `<div class="chat-wrap">
    <div class="card chat">
      <div class="chat-workspace">
        <aside class="chat-history">
          <div class="chat-history-title">${BB.text('Chat history', 'Lịch sử trò chuyện')}</div>
          <button class="new-chat-btn" onclick="newChat()">+ ${BB.text('New chat', 'Chat mới')}</button>
          <div class="chat-tabs">${tabs}</div>
        </aside>
        <div class="chat-main">
          <div class="msgs" id="msgs">${msgs}</div>
          <div class="composer">
            <input id="chatInput" value="${esc(conversation.draft || '')}" oninput="updateChatDraft(this.value)" placeholder="${BB.text('Ask anything about your finances...', 'Hỏi bất cứ điều gì về tài chính của bạn...')}" ${isSending?'disabled':''}>
            <button class="btn" onclick="send()" ${isSending?'disabled':''}>${BB.text('Send ↑', 'Gửi ↑')}</button>
          </div>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card"><h3>Notifications</h3><div style="margin-top:14px">${notes}</div></div>
       <div class="card"><h3>Quick Prompts</h3><div style="margin-top:14px">${promptButtons}</div></div>
    </div>
  </div>`;
  
  const m = $('#msgs'); if(m) m.scrollTop = m.scrollHeight;
}
window.quick = b => {
  const conversation = activeConversation();
  if(!conversation || sendingChats.has(conversation.id)) return;
  conversation.draft = b.textContent.trim();
  render();
  send();
};
window.send = async () => {
  const inp = $('#chatInput');
  const text = inp.value.trim();
  const conversation = activeConversation();
  if(!text || !conversation || sendingChats.has(conversation.id)) return;
  const chatId = conversation.id;
  const hasUserMessage = conversation.messages.some(message => message.from === 'me');
  if(!hasUserMessage && !conversation.customTitle) conversation.title = text.length > 28 ? text.slice(0, 28) + '…' : text;
  conversation.draft = '';
  sendingChats.add(chatId);
  const pending = {from:'ai', text:BB.text('Thinking…', 'Đang phân tích…'), pending:true};
  conversation.messages.push({from:'me', text}, pending);
  inp.value = '';
  saveConversations();
  render();
  try {
    const r = await fetch('/api/coach', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text})});
    const d = await r.json();
    if(!r.ok || !d.reply) throw new Error(d.error || 'coach');
    pending.text = d.reply;
    pending.pending = false;
    pending.source = d.source;
    if(activeChatId !== chatId) conversation.unread = true;
  } catch(error) {
    pending.text = BB.text('Sorry, I could not complete that analysis. Please try again.', 'Xin lỗi, mình chưa thể hoàn tất phân tích. Bạn vui lòng thử lại.');
    pending.pending = false;
    pending.error = true;
  } finally {
    sendingChats.delete(chatId);
    saveConversations();
    render();
    const next = $('#chatInput'); if(next && activeChatId === chatId) next.focus();
  }
};
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && document.activeElement && document.activeElement.id === 'chatInput') send();
});
load();
</script>
</body>
</html>
