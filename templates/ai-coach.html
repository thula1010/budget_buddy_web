<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Buddy — AI Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --accent:#0D9488; --accent-2:#14B8A6;
  --text:#334155; --muted:#94A3B8; --border:#E2E8F0;
  --income:#34D399; --expense:#F87171; --ai:#A78BFA;
  --r:16px; --shadow:0 2px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
}
.app{display:flex;min-height:100vh}
/* ---------- Sidebar ---------- */
.sidebar{
  width:250px;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;gap:12px;align-items:center;padding:22px 20px;border-bottom:1px solid var(--border)}
.brand .logo{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 16px rgba(13,148,136,.28);
}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.2px}
.brand span{font-size:12px;color:var(--muted);font-weight:500}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav a{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;
  background:transparent;border-radius:12px;font:inherit;font-size:15px;font-weight:600;
  color:var(--text);text-decoration:none;transition:.18s;border-left:3px solid transparent;
}
.nav a:hover{background:#F1F5F9}
.nav a.active{
  color:var(--accent);border-left-color:var(--accent);
  background:linear-gradient(90deg,rgba(13,148,136,.10),rgba(13,148,136,0));
}
.profile{
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:18px 20px;border-top:1px solid var(--border);
}
.avatar{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  flex-shrink: 0;
}
.logout-btn{
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  padding: 6px; border-radius: 8px; transition: 0.2s;
}
.logout-btn:hover{ color: var(--expense); background: #FEF2F2; }

/* ---------- Main ---------- */
.main{flex:1;min-width:0}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:22px 32px;border-bottom:1px solid var(--border);background:var(--card);
  position:sticky;top:0;z-index:20;
}
.topbar h2{font-size:26px;font-weight:800;letter-spacing:-.4px}
.topbar p{font-size:13px;color:var(--muted);margin-top:2px}
.synced{
  display:flex;align-items:center;gap:8px;background:#F1F5F9;color:var(--text);
  padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;
}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--income);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{
  border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;font-size:14px;
  color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 4px 14px rgba(13,148,136,.28);transition:.18s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(13,148,136,.34)}
.content{padding:26px 32px 60px;display:flex;flex-direction:column;gap:20px}

/* ---------- AI Coach UI ---------- */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:22px;
}
.card h3{font-size:12px;letter-spacing:1.1px;color:var(--muted);font-weight:700;text-transform:uppercase}
.chat-wrap{display:grid;grid-template-columns:260px minmax(0,1.25fr) .65fr;gap:16px;align-items:start}

/* ---------- Lịch sử trò chuyện ---------- */
.history{padding:16px;display:flex;flex-direction:column;gap:10px;max-height:560px}
.history-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.history-head h3{white-space:nowrap}
.new-chat{
  width:100%;border:1px dashed var(--accent);background:#F0FDFA;color:var(--accent);
  border-radius:11px;padding:11px 12px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:.16s;
}
.new-chat:hover{background:var(--accent);color:#fff}
.history-list{overflow-y:auto;display:flex;flex-direction:column;gap:6px;flex:1;min-height:60px}
.hist-item{
  display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);
  border-radius:11px;padding:9px 10px;cursor:pointer;transition:.14s;
}
.hist-item:hover{border-color:var(--accent);background:#F0FDFA}
.hist-item.active{border-color:var(--accent);background:#F0FDFA;box-shadow:inset 3px 0 0 var(--accent)}
.hist-item .txt{flex:1;min-width:0}
.hist-item .title{
  font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;
}
.hist-item .meta{font-size:11px;color:var(--muted);font-weight:500}
.hist-actions{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:.14s}
.hist-item:hover .hist-actions,.hist-item.active .hist-actions{opacity:1}
.hist-btn{
  border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;
  padding:3px 5px;border-radius:6px;line-height:1;
}
.hist-btn:hover{background:#E2E8F0;color:var(--text)}
.hist-btn.del:hover{background:#FEE2E2;color:var(--expense)}
.history-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:18px 4px;line-height:1.5}
.clear-all{
  border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;
  cursor:pointer;text-decoration:underline;padding:2px;
}
.clear-all:hover{color:var(--expense)}
.msg.typing .bubble{color:var(--muted);font-style:italic}
.src-badge{
  display:inline-block;margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.4px;
  color:var(--muted);text-transform:uppercase;vertical-align:middle;
}
.chat{display:flex;flex-direction:column;height:560px;padding:0;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:22px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:80%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:13px 17px;border-radius:16px;font-size:14px;line-height:1.55;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg.me .bubble{background:var(--accent);color:#fff;border:0;border-radius:16px;border-bottom-right-radius:5px}
.mini{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--accent)}
.msg.ai .mini{background:var(--ai)}
.composer{display:flex;gap:10px;padding:16px;background:var(--card);border-top:1px solid var(--border)}
.composer input{flex:1;padding:13px 16px;border:1px solid var(--border);border-radius:12px;font:inherit;font-size:14px}
.composer input:focus{outline:none;border-color:var(--accent)}
.note-item{border-left:3px solid var(--c);background:var(--b);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;font-weight:600;line-height:1.45}
.note-item small{display:block;color:var(--muted);font-weight:500;margin-top:5px;font-size:11.5px}
.qp{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;font:inherit;
  font-size:13.5px;font-weight:600;background:var(--card);border:1px solid var(--border);
  border-radius:11px;cursor:pointer;transition:.16s;
}
.qp:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

@media(max-width:1200px){
  .chat-wrap{grid-template-columns:230px minmax(0,1fr)}
  .chat-wrap > .side-col{grid-column:1 / -1}
}
@media(max-width:1000px){
  .chat-wrap{grid-template-columns:1fr}
  .chat-wrap > .side-col{grid-column:auto}
  .history{max-height:280px}
  .sidebar{width:76px}.brand div,.nav a span.lbl,.profile div,.logout-btn{display:none}
}
</style>
<script>window.BB_PREFS = {language: "{{ user.language or 'vi' }}", currency: "{{ user.currency or 'VND' }}"};</script>
<script src="{{ url_for('static', filename='js/bb-i18n.js') }}"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">&#128176;</div>
      <div><h1>Budget Buddy</h1><span data-i18n="brand.tagline">&middot; Smart Finance</span></div>
    </div>
    <nav class="nav">
      <a href="/">&#127968; <span class="lbl" data-i18n="nav.overview">Overview</span></a>
      <a href="transactions">&#8596;&#65039; <span class="lbl" data-i18n="nav.transactions">Transactions</span></a>
      <a href="budgets">&#128202; <span class="lbl" data-i18n="nav.budgets">Budgets</span><i class="dot" id="budDot" style="display:none"></i></a>
      <a href="goals">&#127919; <span class="lbl" data-i18n="nav.goals">Goals</span></a>
      <a href="ai-coach" class="active">&#10024; <span class="lbl" data-i18n="nav.coach">AI Coach</span></a>
    </nav>
    <div class="profile">
      <div style="display: flex; gap: 12px; align-items: center; min-width: 0;">
        <div class="avatar" id="avatar">{{ user.username[0].upper() }}</div>
        <div style="min-width: 0;">
          <b id="uname" style="font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ user.username }}</b>
          <small id="uplan" style="color: var(--muted); font-size: 12px;">Student</small>
        </div>
      </div>
      <a href="/settings" data-i18n-title="nav.settings" title="Cài đặt" class="logout-btn" aria-label="Cài đặt">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"></path></svg>
      </a>
      <a href="/logout" data-i18n-title="nav.logout" title="Đăng xuất" class="logout-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </a>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h2 data-i18n="page.coach.title">AI Coach</h2><p data-i18n="page.coach.sub">Personal Smart Assistant</p></div>
      <div style="display:flex;gap:12px;align-items:center">
        <div data-bb-switcher></div>
        <div class="synced"><i class="pulse"></i> <span data-i18n="common.synced">Synced</span></div>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<script>
/* ============================================================
   AI Coach — trò chuyện có lưu lịch sử.
   Mọi tin nhắn được lưu trong DB theo từng cuộc trò chuyện
   (ChatSession/ChatMessage), nên đóng trình duyệt vẫn còn.
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t = (k, v) => BB.t(k, v);

let S = null;                 // trạng thái tài chính từ /api/state
let sessions = [];            // danh sách cuộc trò chuyện
let activeSessionId = null;   // null = cuộc trò chuyện mới chưa lưu
let chat = [];                // tin nhắn của cuộc đang mở
let sending = false;

async function api(url, options){
  const response = await fetch(url, options);
  const data = await response.json().catch(() => ({}));
  if(!response.ok) throw new Error(data.error || t('common.error'));
  return data;
}

async function load(){
  S = await api('/api/state');
  await loadSessions();
  if(sessions.length){
    await openSession(sessions[0].id);
  } else {
    startNewChat(false);
  }
}

async function loadSessions(){
  const data = await api('/api/chat/sessions');
  sessions = data.sessions || [];
}

function greeting(){
  return {from:'ai', text: t('coach.greeting', {name: S ? S.user.name : ''}), source:'local'};
}

function startNewChat(focus){
  activeSessionId = null;
  chat = [greeting()];
  render();
  if(focus !== false){ const box = $('#chatInput'); if(box) box.focus(); }
}

async function openSession(id){
  const data = await api('/api/chat/sessions/' + id);
  activeSessionId = data.session.id;
  chat = data.messages.length ? data.messages.map(m => ({from:m.from, text:m.text, source:m.source})) : [greeting()];
  render();
}

function relativeTime(iso){
  const then = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
  const mins = Math.round((Date.now() - then.getTime()) / 60000);
  if(mins < 1) return t('time.now');
  if(mins < 60) return t('time.minutes', {n: mins});
  const hours = Math.round(mins / 60);
  if(hours < 24) return t('time.hours', {n: hours});
  return then.toLocaleDateString(BB.localeDate(), {day:'2-digit', month:'2-digit'});
}

function historyHtml(){
  const items = sessions.length ? sessions.map(item => `
    <div class="hist-item ${item.id === activeSessionId ? 'active' : ''}" onclick="pickSession(${item.id})">
      <div class="txt">
        <span class="title">${esc(item.title)}</span>
        <span class="meta">${t('coach.msg_count', {n: item.message_count})} &middot; ${relativeTime(item.updated_at)}</span>
      </div>
      <div class="hist-actions">
        <button class="hist-btn" title="${t('coach.rename')}" onclick="event.stopPropagation();renameSession(${item.id})">&#9998;</button>
        <button class="hist-btn del" title="${t('common.delete')}" onclick="event.stopPropagation();removeSession(${item.id})">&times;</button>
      </div>
    </div>`).join('') : `<div class="history-empty">${t('coach.no_history')}</div>`;

  return `<div class="card history side-col">
    <div class="history-head">
      <h3>${t('coach.history')}</h3>
      ${sessions.length ? `<button class="clear-all" onclick="clearHistory()">${t('coach.clear_all')}</button>` : ''}
    </div>
    <button class="new-chat" onclick="startNewChat()">${t('coach.new_chat')}</button>
    <div class="history-list">${items}</div>
  </div>`;
}

function render(){
  if(!S) return;
  $('#uname').textContent = S.user.name;
  $('#uplan').textContent = t('common.plan');
  $('#avatar').textContent = S.user.initials;

  const NC = {warn:['#F59E0B','#FFFBEB'], ai:['#A78BFA','#F5F3FF'], done:['#34D399','#ECFDF5']};
  const notes = (S.notifications || []).map(n => {
    const colors = NC[n.kind] || NC.ai;
    return `<div class="note-item" style="--c:${colors[0]};--b:${colors[1]}">
      ${esc(n.text)}<small>${esc(n.ago)}</small></div>`;
  }).join('');

  const prompts = ['coach.prompt1','coach.prompt2','coach.prompt3','coach.prompt4']
    .map(key => `<button class="qp" onclick="quick(this)">${t(key)}</button>`).join('');

  const msgs = chat.map(m => `
    <div class="msg ${m.from === 'me' ? 'me' : 'ai'} ${m.typing ? 'typing' : ''}">
      <div class="mini">${m.from === 'me' ? esc(S.user.initials) : '&#10024;'}</div>
      <div class="bubble">${esc(m.text)}</div>
    </div>`).join('');

  $('#view').innerHTML = `<div class="chat-wrap">
    ${historyHtml()}
    <div class="card chat">
      <div class="msgs" id="msgs">${msgs}</div>
      <div class="composer">
        <input id="chatInput" placeholder="${t('coach.placeholder')}" ${sending ? 'disabled' : ''}>
        <button class="btn" onclick="send()" ${sending ? 'disabled' : ''}>${t('coach.send')} &uarr;</button>
      </div>
    </div>
    <div class="side-col" style="display:flex;flex-direction:column;gap:16px">
      <div class="card"><h3>${t('coach.notifications')}</h3><div style="margin-top:14px">${notes}</div></div>
      <div class="card"><h3>${t('coach.quick_prompts')}</h3><div style="margin-top:14px">${prompts}</div></div>
    </div>
  </div>`;

  BB.applyDom($('#view'));
  const m = $('#msgs'); if(m) m.scrollTop = m.scrollHeight;
}

/* ---------- hành động trên lịch sử ---------- */
window.pickSession = async id => {
  if(id === activeSessionId) return;
  try { await openSession(id); } catch(e) { alert(e.message); }
};

window.renameSession = async id => {
  const current = sessions.find(x => x.id === id);
  const title = prompt(t('coach.rename_prompt'), current ? current.title : '');
  if(title === null) return;
  if(!title.trim()) return;
  try {
    await api('/api/chat/sessions/' + id, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({title: title.trim()})
    });
    await loadSessions();
    render();
  } catch(e) { alert(e.message); }
};

window.removeSession = async id => {
  const current = sessions.find(x => x.id === id);
  if(!confirm(t('coach.delete_confirm', {title: current ? current.title : ''}))) return;
  try {
    await api('/api/chat/sessions/' + id, {method:'DELETE'});
    await loadSessions();
    if(activeSessionId === id){
      if(sessions.length) await openSession(sessions[0].id);
      else startNewChat(false);
    } else {
      render();
    }
  } catch(e) { alert(e.message); }
};

window.clearHistory = async () => {
  if(!confirm(t('coach.clear_confirm'))) return;
  try {
    await api('/api/chat/sessions', {method:'DELETE'});
    sessions = [];
    startNewChat(false);
  } catch(e) { alert(e.message); }
};

window.startNewChat = startNewChat;
window.quick = b => { const box = $('#chatInput'); box.value = b.textContent.trim(); send(); };

window.send = async () => {
  if(sending) return;
  const input = $('#chatInput');
  const text = input.value.trim();
  if(!text) return;

  chat.push({from:'me', text});
  chat.push({from:'ai', text: t('coach.thinking'), typing: true});
  input.value = '';
  sending = true;
  render();

  try {
    const payload = {message: text};
    if(activeSessionId) payload.session_id = activeSessionId;
    const data = await api('/api/coach', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    chat.pop();  // bỏ dòng "đang phân tích"
    chat.push({from:'ai', text: data.reply, source: data.source});
    activeSessionId = data.session.id;
    await loadSessions();
  } catch(e) {
    chat.pop();
    chat.push({from:'ai', text: e.message, source:'local'});
  } finally {
    sending = false;
    render();
    const box = $('#chatInput'); if(box) box.focus();
  }
};

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && document.activeElement && document.activeElement.id === 'chatInput') send();
});

/* Đổi ngôn ngữ / tiền tệ: vẽ lại giao diện (tin nhắn cũ giữ nguyên ngôn ngữ lúc hỏi). */
BB.onChange(() => { if(S) render(); });

load().catch(e => {
  document.getElementById('view').innerHTML =
    '<div class="card"><p style="color:var(--expense)">' + esc(e.message) + '</p></div>';
});
</script>
</body>
</html>
