<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Buddy - Login</title>
  <script>
    window.BB_PREFERENCES = {
      language: localStorage.getItem('bb-entry-language') === 'vi' ? 'vi' : 'en',
      currency: 'VND',
      usd_vnd_rate: {{ app_preferences.usd_vnd_rate|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/preferences.js') }}"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC; --card: #FFFFFF; --accent: #0D9488; --accent-2: #14B8A6;
      --text: #334155; --muted: #94A3B8; --border: #E2E8F0; --expense: #F87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg); color: var(--text);
      display: grid; place-items: center; min-height: 100vh;
    }
    .auth-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; width: 400px; padding: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; justify-content: center; }
    .logo {
      width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
      font-size: 22px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 6px 16px rgba(13,148,136,.28);
    }
    .tabs { display: flex; background: #F1F5F9; padding: 4px; border-radius: 12px; margin-bottom: 24px; }
    .tab-btn {
      flex: 1; padding: 10px; border: 0; background: transparent; font: inherit;
      font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; border-radius: 9px; transition: .2s;
    }
    .tab-btn.active { background: var(--card); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 11px;
      font: inherit; font-size: 14px; outline: none; transition: .18s;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,.1); }
    .btn {
      width: 100%; padding: 13px; border: 0; border-radius: 12px; font: inherit;
      font-weight: 700; font-size: 15px; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 4px 14px rgba(13,148,136,.28); margin-top: 8px; transition: .18s;
    }
    .btn:hover { transform: translateY(-1px); }
    .alert { background: #FEE2E2; color: #991B1B; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
    .form-box { display: none; }
    .form-box.active { display: block; }
    .language-row { display:flex; justify-content:flex-end; margin:-8px 0 14px; }
    .language-row select { border:1px solid var(--border); border-radius:9px; padding:7px 10px; background:#fff; color:var(--text); font:inherit; font-size:12px; font-weight:700; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand">
      <div class="logo">💰</div>
      <div>
        <h1 style="font-size: 18px; font-weight: 800;">Budget Buddy</h1>
        <span style="font-size: 12px; color: var(--muted);">Smart Finance</span>
      </div>
    </div>

    <div class="language-row">
      <select id="entryLanguage" aria-label="Language">
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
      </select>
    </div>

    <!-- Thông báo lỗi (nếu có) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Log in</button>
      <button class="tab-btn" onclick="switchTab('signup')">Sign up</button>
    </div>

    <!-- FORM LOGIN -->
    <form id="loginForm" class="form-box active" action="/api/login" method="POST">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" required placeholder="Enter username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn">Log in</button>
    </form>

    <!-- FORM SIGNUP -->
    <form id="signupForm" class="form-box" action="/api/signup" method="POST">
      <input type="hidden" name="preferred_language" id="signupLanguage" value="en">
      <input type="hidden" name="preferred_currency" value="VND">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" required placeholder="Enter username">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required placeholder="name@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input type="password" name="confirm_password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn">Create account</button>
    </form>
  </div>

  <script>
    const entryLanguage = document.getElementById('entryLanguage');
    entryLanguage.value = BB.language;
    document.getElementById('signupLanguage').value = BB.language;
    entryLanguage.onchange = () => {
      localStorage.setItem('bb-entry-language', entryLanguage.value);
      window.location.reload();
    };
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.form-box').forEach(box => box.classList.remove('active'));

      if (tab === 'login') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('signupForm').classList.add('active');
      }
    }
  </script>
</body>
</html>
