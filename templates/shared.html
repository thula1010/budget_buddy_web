<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Buddy — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --accent:#0D9488; --accent-2:#14B8A6;
  --text:#334155; --muted:#94A3B8; --border:#E2E8F0;
  --income:#34D399; --expense:#F87171; --ai:#A78BFA; --warn:#F59E0B;
  --r:16px; --shadow:0 2px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  width:250px;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;gap:12px;align-items:center;padding:22px 20px;border-bottom:1px solid var(--border)}
.brand .logo{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 16px rgba(13,148,136,.28);
}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.2px}
.brand span{font-size:12px;color:var(--muted);font-weight:500}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;
  background:transparent;border-radius:12px;font:inherit;font-size:15px;font-weight:600;
  color:var(--text);cursor:pointer;transition:.18s;border-left:3px solid transparent;
}
.nav button:hover{background:#F1F5F9}
.nav button.active{
  color:var(--accent);border-left-color:var(--accent);
  background:linear-gradient(90deg,rgba(13,148,136,.10),rgba(13,148,136,0));
}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--expense);margin-left:auto}
.profile{display:flex;gap:12px;align-items:center;padding:18px 20px;border-top:1px solid var(--border)}
.avatar{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
}
.profile b{font-size:14px;display:block}
.profile small{color:var(--muted);font-size:12px}

/* ---------- Main ---------- */
.main{flex:1;min-width:0}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:22px 32px;border-bottom:1px solid var(--border);background:var(--card);
  position:sticky;top:0;z-index:20;
}
.topbar h2{font-size:26px;font-weight:800;letter-spacing:-.4px}
.topbar p{font-size:13px;color:var(--muted);margin-top:2px}
.synced{
  display:flex;align-items:center;gap:8px;background:#F1F5F9;color:var(--text);
  padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;
}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--income);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{
  border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;font-size:14px;
  color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 4px 14px rgba(13,148,136,.28);transition:.18s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(13,148,136,.34)}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.content{padding:26px 32px 60px;display:flex;flex-direction:column;gap:20px}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:22px;transition:.2s;
}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.card h3{font-size:12px;letter-spacing:1.1px;color:var(--muted);font-weight:700;text-transform:uppercase}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1.15fr .85fr}

.kpi{position:relative;overflow:hidden;animation:fadeUp .5s both}
.kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.kpi .top{display:flex;justify-content:space-between;align-items:flex-start}
.kpi .tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.kpi .val{font-size:32px;font-weight:800;letter-spacing:-1px;margin:10px 0 6px}
.kpi .sub{font-size:12.5px;color:var(--muted);font-weight:500}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.alert{
  display:flex;align-items:center;gap:14px;background:#FFF7ED;border:1px solid #FED7AA;
  color:#9A3412;border-radius:var(--r);padding:16px 20px;font-weight:600;font-size:14.5px;
}
.alert .btn{margin-left:auto;padding:8px 16px;font-size:13px}

/* ---------- Accounts ---------- */
.acc-group{margin-top:14px}
.acc-head{
  display:flex;justify-content:space-between;background:#F8FAFC;padding:8px 14px;
  border-radius:10px;font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--muted);
}
.acc-row{display:flex;align-items:center;gap:14px;padding:13px 6px;border-bottom:1px solid #F1F5F9}
.acc-row:last-child{border-bottom:0}
.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.acc-row b{font-size:14.5px;display:block}
.acc-row small{color:var(--muted);font-size:12px}
.acc-row .amt{margin-left:auto;text-align:right;font-weight:800;font-size:14.5px}
.acc-row .amt small{display:block;font-weight:600;color:var(--income)}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:11.5px;letter-spacing:.9px;color:var(--muted);
  text-transform:uppercase;padding:0 8px 14px;font-weight:700;
}
td{padding:13px 8px;border-top:1px solid #F1F5F9;font-size:14px;vertical-align:middle}
tr.txn:hover{background:#F8FAFC}
.badge{
  display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;
}
.ai-badge{background:#F3E8FF;color:#7C3AED;font-size:10.5px;padding:3px 8px;border-radius:6px;font-weight:700;margin-left:8px}
.amt-pos{color:#059669;font-weight:800;text-align:right}
.amt-neg{color:#DC2626;font-weight:800;text-align:right}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;opacity:0;transition:.15s}
tr.txn:hover .del{opacity:1}
.del:hover{color:var(--expense)}
.search{
  flex:1;padding:14px 18px;border:1px solid var(--border);border-radius:12px;
  font:inherit;font-size:14px;background:var(--card);
}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.1)}

/* ---------- Budgets ---------- */
.bud{padding:14px 0;border-bottom:1px solid #F1F5F9}
.bud:last-child{border-bottom:0}
.bud .r1{display:flex;align-items:center;gap:12px}
.bud b{font-size:14.5px;flex:1}
.bud .nums{color:var(--muted);font-size:13px;font-weight:600}
.bar{height:8px;border-radius:99px;background:#F1F5F9;margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.over-txt{color:var(--expense);font-size:12.5px;font-weight:600;margin-top:7px}

/* ---------- Goals ---------- */
.goal-banner{
  background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;
  border-radius:var(--r);padding:26px 28px;display:flex;align-items:center;justify-content:space-between;
}
.goal-banner .t{font-size:14px;opacity:.9;font-weight:600}
.goal-banner .v{font-size:38px;font-weight:800;letter-spacing:-1.2px;margin-top:4px}
.goal-banner .pill{background:rgba(255,255,255,.22);padding:9px 18px;border-radius:999px;font-weight:700;font-size:13.5px}
.goal{position:relative;overflow:hidden;padding-top:26px}
.goal::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--c)}
.goal .pct{font-size:30px;font-weight:800;color:var(--c);letter-spacing:-1px}
.goal .nm{font-size:18px;font-weight:800;margin-top:14px}
.goal .dl{color:var(--muted);font-size:13px;margin-top:3px}
.goal .note{border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;margin-top:14px}

/* ---------- AI Coach ---------- */
.chat-wrap{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;align-items:start}
.chat{display:flex;flex-direction:column;height:560px;padding:0;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:22px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:80%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:13px 17px;border-radius:16px;font-size:14px;line-height:1.55;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg.me .bubble{background:var(--accent);color:#fff;border:0;border-radius:16px;border-bottom-right-radius:5px}
.mini{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--accent)}
.msg.ai .mini{background:var(--ai)}
.composer{display:flex;gap:10px;padding:16px;background:var(--card);border-top:1px solid var(--border)}
.composer input{flex:1;padding:13px 16px;border:1px solid var(--border);border-radius:12px;font:inherit;font-size:14px}
.composer input:focus{outline:none;border-color:var(--accent)}
.note-item{border-left:3px solid var(--c);background:var(--b);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;font-weight:600;line-height:1.45}
.note-item small{display:block;color:var(--muted);font-weight:500;margin-top:5px;font-size:11.5px}
.qp{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;font:inherit;
  font-size:13.5px;font-weight:600;background:var(--card);border:1px solid var(--border);
  border-radius:11px;cursor:pointer;transition:.16s;
}
.qp:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50}
.overlay.open{display:grid}
.modal{background:var(--card);border-radius:20px;width:480px;max-width:94vw;max-height:92vh;overflow:auto;padding:28px}
.modal h3{font-size:20px;text-transform:none;letter-spacing:-.3px;color:var(--text);margin-bottom:18px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
.field input,.field select{
  width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:11px;
  font:inherit;font-size:14px;background:var(--card);color:var(--text);
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.toggle{display:flex;gap:8px;background:#F1F5F9;padding:5px;border-radius:12px;margin-bottom:18px}
.toggle button{
  flex:1;padding:10px;border:0;background:transparent;border-radius:9px;font:inherit;
  font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:.16s;
}
.toggle button.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.preview{background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:13px 15px;font-size:13.5px;font-weight:600;margin-bottom:15px}
.err{color:var(--expense);font-size:13px;font-weight:600;margin-bottom:12px;min-height:18px}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
canvas{max-width:100%}
@media(max-width:1000px){
  .g4,.g3{grid-template-columns:repeat(2,1fr)}
  .g2,.chat-wrap{grid-template-columns:1fr}
  .sidebar{width:76px}.brand div,.nav button span.lbl,.profile div{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">&#128176;</div>
      <div><h1>Budget Buddy</h1><span>&middot; Smart Finance</span></div>
    </div>
    <nav class="nav" id="nav">
      <button data-tab="overview" class="active">&#127968; <span class="lbl">Overview</span></button>
      <button data-tab="transactions">&#8596;&#65039; <span class="lbl">Transactions</span></button>
      <button data-tab="budgets">&#128202; <span class="lbl">Budgets</span><i class="dot" id="budDot" style="display:none"></i></button>
      <button data-tab="goals">&#127919; <span class="lbl">Goals</span></button>
      <button data-tab="coach">&#10024; <span class="lbl">AI Coach</span></button>
    </nav>
    <!-- Dán đoạn này vào cuối <aside class="sidebar"> của các trang khác -->
<div class="profile">
  <div style="display: flex; gap: 12px; align-items: center; min-width: 0;">
    <div class="avatar" id="avatar">{{ user.username[0].upper() }}</div>
    <div style="min-width: 0;">
      <b id="uname" style="font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ user.username }}</b>
      <small id="uplan" style="color: var(--muted); font-size: 12px;">Student</small>
    </div>
  </div>
  
  <a href="/logout" title="Đăng xuất" class="logout-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
  </a>
</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h2 id="pageTitle">Overview</h2><p id="pageSub">July 2025 &middot; All accounts synced</p></div>
      <div style="display:flex;gap:12px;align-items:center">
        <div class="synced"><i class="pulse"></i> Synced</div>
        <button class="btn" id="openModal">+ Add Transaction</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<!-- Add Transaction modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Add Transaction</h3>
    <div class="toggle">
      <button id="tExp" class="on">Expense</button>
      <button id="tInc">Income</button>
    </div>
    <div class="field"><label>Merchant / Mô tả</label><input id="fMerchant" placeholder="VD: Highlands Coffee"></div>
    <div class="row2">
      <div class="field"><label>Amount (&#8363;)</label><input id="fAmount" type="number" min="0" step="1000" placeholder="45000"></div>
      <div class="field"><label>Date</label><input id="fDate" type="date"></div>
    </div>
    <div class="field"><label>Category</label><select id="fCat"></select></div>
    <div class="field"><label>Paid via / Account</label><select id="fAcc"></select></div>
    <div class="preview" id="preview"></div>
    <div class="err" id="err"></div>
    <div class="row2">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveBtn">Save Transaction</button>
    </div>
  </div>
</div>


<script>

const DB = {
  period: SEED.period,
  user: SEED.user,
  accounts: SEED.accounts.map(a => ({...a})),
  categories: SEED.categories.map(c => ({...c})),
  transactions: SEED.transactions.map(t => ({...t})),
  goals: SEED.goals.map(g => ({...g})),
  notifications: SEED.notifications.map(n => ({...n})),
  limits: SEED.budgets.map(b => ({category_id:b.category_id, limit_vnd:b.limit_vnd})),
};
let nextId = Math.max.apply(null, DB.transactions.map(t => t.id)) + 1;

function buildState(){
  const P = DB.period;
  const m = DB.transactions.filter(t => t.date.indexOf(P) === 0);
  const income  = m.filter(t => t.amount > 0).reduce((s,t) => s + t.amount, 0);
  const expense = -m.filter(t => t.amount < 0).reduce((s,t) => s + t.amount, 0);
  const balance = DB.accounts.reduce((s,a) => s + a.balance, 0);
  const budgets = DB.limits.map(l => {
    const c = DB.categories.find(x => x.id === l.category_id);
    const spent = -m.filter(t => t.category_id === l.category_id && t.amount < 0)
                    .reduce((s,t) => s + t.amount, 0);
    return {category_id:l.category_id, limit_vnd:l.limit_vnd, category:c.name,
            icon:c.icon, color:c.color, bg:c.bg, spent:spent,
            pct: Math.round(spent / l.limit_vnd * 100),
            over: Math.max(0, spent - l.limit_vnd)};
  });
  const weekly = [0,0,0,0];
  const byCat = {};
  m.forEach(t => {
    if(t.amount >= 0) return;
    const d = parseInt(t.date.slice(-2), 10);
    weekly[Math.min(Math.floor((d-1)/7), 3)] += -t.amount;
    byCat[t.category] = (byCat[t.category] || 0) + -t.amount;
  });
  const sorted = DB.transactions.slice().sort(
    (a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id);
  return {period:P, user:DB.user, accounts:DB.accounts, categories:DB.categories,
    transactions:sorted, budgets:budgets, goals:DB.goals, notifications:DB.notifications,
    kpi:{balance:balance, income:income, expense:expense, target_rate:70,
         savings_rate: income ? Math.round((income-expense)/income*100) : 0},
    charts:{weekly:weekly, by_category:byCat}};
}

function fmtd(n){ return n.toLocaleString('vi-VN') + 'd'; }

function coach(q){
  q = (q || '').toLowerCase();
  const s = buildState(), k = s.kpi;
  const over = s.budgets.filter(b => b.over > 0);
  const near = s.budgets.filter(b => b.pct >= 80 && b.pct <= 100);
  const cats = Object.keys(s.charts.by_category)
    .map(n => [n, s.charts.by_category[n]]).sort((a,b) => b[1] - a[1]);
  const has = arr => arr.some(w => q.indexOf(w) >= 0);
  if(has(['goal','m\u1ee5c ti\u00eau','muc tieu','macbook','ti\u1ebft ki\u1ec7m','tiet kiem'])){
    const act = s.goals.filter(g => g.saved < g.target);
    if(!act.length) return 'B\u1ea1n \u0111\u00e3 ho\u00e0n th\u00e0nh t\u1ea5t c\u1ea3 m\u1ee5c ti\u00eau. Tuy\u1ec7t v\u1eddi!';
    const g = act.reduce((a,b) => (a.target - a.saved) <= (b.target - b.saved) ? a : b);
    const remain = g.target - g.saved, monthly = Math.max(1, k.income - k.expense);
    return 'B\u1ea1n c\u00f2n ' + fmtd(remain) + ' n\u1eefa l\u00e0 \u0111\u1ea1t m\u1ee5c ti\u00eau "' + g.name
      + '". V\u1edbi t\u1ed1c \u0111\u1ed9 ti\u1ebft ki\u1ec7m ' + fmtd(monthly) + '/th\u00e1ng, b\u1ea1n c\u1ea7n kho\u1ea3ng '
      + Math.max(1, Math.round(remain / monthly)) + ' th\u00e1ng n\u1eefa.';
  }
  if(has(['budget','ng\u00e2n s\u00e1ch','ngan sach','v\u01b0\u1ee3t','vuot'])){
    if(over.length) return 'Ng\u00e2n s\u00e1ch ' + over[0].category + ' \u0111\u00e3 v\u01b0\u1ee3t ' + fmtd(over[0].over)
      + ' (' + fmtd(over[0].spent) + '/' + fmtd(over[0].limit_vnd)
      + '). N\u00ean t\u1ea1m d\u1eebng chi cho m\u1ee5c n\u00e0y \u0111\u1ebfn cu\u1ed1i th\u00e1ng.';
    if(near.length) return near[0].category + ' \u0111\u00e3 d\u00f9ng ' + near[0].pct
      + '% ng\u00e2n s\u00e1ch \u2014 s\u1eafp ch\u1ea1m gi\u1edbi h\u1ea1n.';
    return 'T\u1ea5t c\u1ea3 ng\u00e2n s\u00e1ch \u0111\u1ec1u trong t\u1ea7m ki\u1ec3m so\u00e1t.';
  }
  if(has(['account','t\u00e0i kho\u1ea3n','tai khoan','s\u1ed1 d\u01b0','so du','v\u00ed'])){
    return 'S\u1ed1 d\u01b0 hi\u1ec7n t\u1ea1i \u2014 '
      + DB.accounts.map(a => a.name + ': ' + fmtd(a.balance)).join(', ')
      + '. T\u1ed5ng: ' + fmtd(k.balance) + '.';
  }
  return 'Th\u00e1ng n\u00e0y b\u1ea1n thu ' + fmtd(k.income) + ', chi ' + fmtd(k.expense)
    + ', t\u1ef7 l\u1ec7 ti\u1ebft ki\u1ec7m ' + k.savings_rate + '%. Kho\u1ea3n chi l\u1edbn nh\u1ea5t l\u00e0 '
    + (cats[0] ? cats[0][0] + ' v\u1edbi ' + fmtd(cats[0][1]) : '-') + '.'
    + (over.length ? ' L\u01b0u \u00fd: ' + over[0].category + ' \u0111\u00e3 v\u01b0\u1ee3t ng\u00e2n s\u00e1ch.' : '');
}

function reply(obj, ok){
  return Promise.resolve({ok: ok !== false, json: () => Promise.resolve(obj)});
}

window.fetch = function(url, opts){
  opts = opts || {};
  const body = opts.body ? JSON.parse(opts.body) : {};
  if(url === '/api/state') return reply(buildState());

  if(url === '/api/transactions' && opts.method === 'POST'){
    const merchant = (body.merchant || '').trim();
    const amount = Math.round(Number(body.amount));
    if(!merchant) return reply({error:'Vui l\u00f2ng nh\u1eadp t\u00ean giao d\u1ecbch'}, false);
    if(!(amount > 0)) return reply({error:'S\u1ed1 ti\u1ec1n ph\u1ea3i l\u1edbn h\u01a1n 0'}, false);
    const acc = DB.accounts.find(a => a.id === body.account_id);
    const cat = DB.categories.find(c => c.id === body.category_id);
    if(!acc || !cat) return reply({error:'Thi\u1ebfu danh m\u1ee5c ho\u1eb7c t\u00e0i kho\u1ea3n'}, false);
    const signed = body.type === 'income' ? amount : -amount;
    if(acc.balance + signed < 0) return reply({error:'S\u1ed1 d\u01b0 ' + acc.name + ' kh\u00f4ng \u0111\u1ee7'}, false);
    acc.balance += signed;
    DB.transactions.push({id: nextId++, merchant: merchant, amount: signed,
      date: body.date || DB.period + '-28', category_id: cat.id, account_id: acc.id,
      ai_tagged: 0, category: cat.name, cat_icon: cat.icon, color: cat.color, bg: cat.bg,
      account: acc.name, acc_icon: acc.icon});
    return reply(buildState());
  }

  if(url.indexOf('/api/transactions/') === 0 && opts.method === 'DELETE'){
    const id = parseInt(url.split('/').pop(), 10);
    const i = DB.transactions.findIndex(t => t.id === id);
    if(i < 0) return reply({error:'Kh\u00f4ng t\u00ecm th\u1ea5y giao d\u1ecbch'}, false);
    const t = DB.transactions[i];
    const acc = DB.accounts.find(a => a.id === t.account_id);
    if(acc) acc.balance -= t.amount;
    DB.transactions.splice(i, 1);
    return reply(buildState());
  }

  if(url.indexOf('/api/goals/') === 0){
    const id = parseInt(url.split('/')[3], 10);
    const g = DB.goals.find(x => x.id === id);
    const amount = Math.round(Number(body.amount));
    if(!(amount > 0)) return reply({error:'S\u1ed1 ti\u1ec1n ph\u1ea3i l\u1edbn h\u01a1n 0'}, false);
    if(g) g.saved += amount;
    return reply(buildState());
  }

  if(url === '/api/coach') return reply({reply: coach(body.message)});
  return reply({error:'404'}, false);
};

  if (a >= 1e6) return (n/1e6).toFixed(1).replace('.0','') + 'M';
  if (a >= 1e3) return Math.round(n/1e3) + 'K';

        <h3>Accounts Overview</h3>
        <div style="text-align:right"><h3>Total across accounts</h3>
        <b style="font-size:22px;color:var(--accent)">${money(S.kpi.balance)}</b></div>
      </div>${accHtml}
      <button class="btn ghost" style="width:100%;margin-top:16px" onclick="alert('Demo: chức năng liên kết tài khoản')">+ Link Account</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card"><h3>Spending by Category</h3><canvas id="donut" height="210"></canvas></div>
      <div class="card"><h3>Weekly Spend</h3><canvas id="bars" height="150"></canvas></div>
    </div>
  </div>
  <div class="card"><h3>Recent Transactions</h3>${txnTable(S.transactions.slice(0,6), false)}</div>`;
}

/* ---------- Transactions ---------- */
function txnTable(list, delBtn){
  if(!list.length) return '<p style="color:var(--muted);padding:20px 0">Chưa có giao dịch nào.</p>';
  return `<table><thead><tr><th>Merchant</th><th>Category</th><th>Account</th><th style="text-align:right">Amount</th>${delBtn?'<th></th>':''}</tr></thead><tbody>` +
    list.map(t => `
      <tr class="txn">
        <td><div style="display:flex;align-items:center;gap:12px">
          <div class="tile" style="background:${t.bg}">${t.cat_icon}</div>
          <div><b>${esc(t.merchant)}</b>${t.ai_tagged?'<span class="ai-badge">AI tagged</span>':''}
          <small style="display:block;color:var(--muted)">${dmy(t.date)}</small></div></div></td>
        <td><span class="badge" style="background:${t.bg};color:${t.color}">${esc(t.category)}</span></td>
        <td style="color:var(--muted);font-weight:600">${esc(t.account)}</td>
        <td class="${t.amount>0?'amt-pos':'amt-neg'}">${t.amount>0?'+':'-'}${full(Math.abs(t.amount))}</td>
        ${delBtn?`<td style="width:34px"><button class="del" onclick="delTxn(${t.id})">&times;</button></td>`:''}
      </tr>`).join('') + '</tbody></table>';
}

function vTxns(){
  const q = search.toLowerCase();
  const list = S.transactions.filter(t =>
    !q || t.merchant.toLowerCase().includes(q) || t.category.toLowerCase().includes(q) || t.account.toLowerCase().includes(q));
  const k = S.kpi;
  const cards = [
    ['TOTAL INCOME','&#128184;','#D1FAE5','#059669','+'+money(k.income)],
    ['TOTAL EXPENSES','&#128181;','#FEE2E2','#DC2626','-'+money(k.expense)],
    ['NET THIS MONTH','&#128200;','#CCFBF1','#0D9488', money(k.income-k.expense)],
  ].map(c => `<div class="card" style="display:flex;gap:14px;align-items:center">
      <div class="tile" style="background:${c[2]}">${c[1]}</div>
      <div><h3>${c[0]}</h3><div style="font-size:24px;font-weight:800;color:${c[3]}">${c[4]}</div></div>
    </div>`).join('');

  return `<div class="grid g3">${cards}</div>
  <div style="display:flex;gap:12px">
    <input class="search" id="searchBox" placeholder="&#128269;  Search merchants, categories, accounts..." value="${esc(search)}">
    <button class="btn ghost" onclick="exportCSV()">Export CSV</button>
  </div>
  <div class="card">${txnTable(list, true)}</div>`;
}

/* ---------- Budgets ---------- */
function vBudgets(){
  const total = S.budgets.reduce((s,b) => s + b.limit_vnd, 0);
  const spent = S.budgets.reduce((s,b) => s + b.spent, 0);
  const cards = [
    ['TOTAL BUDGET','&#128179;','#DBEAFE','#1D4ED8', money(total)],
    ['TOTAL SPENT','&#128184;','#FEF3C7','#B45309', money(spent)],
    ['REMAINING','&#128994;','#D1FAE5','#059669', money(total-spent)],
  ].map(c => `<div class="card" style="display:flex;gap:14px;align-items:center">
      <div class="tile" style="background:${c[2]}">${c[1]}</div>
      <div><h3>${c[0]}</h3><div style="font-size:24px;font-weight:800;color:${c[3]}">${c[4]}</div></div>
    </div>`).join('');

  const bars = S.budgets.map(b => {
    const col = b.over > 0 ? '#F87171' : b.pct >= 80 ? '#F59E0B' : '#34D399';
    return `<div class="bud">
      <div class="r1">
        <div class="tile" style="background:${b.bg}">${b.icon}</div>
        <b>${esc(b.category)}</b>
        <span class="nums">${fmtVND(b.spent)} / ${fmtVND(b.limit_vnd)}</span>
        <span class="badge" style="background:${b.over>0?'#FEE2E2':'#F1F5F9'};color:${b.over>0?'#DC2626':col}">
          ${b.over>0?'OVER':b.pct+'%'}</span>
      </div>
      <div class="bar"><i style="width:${Math.min(100,b.pct)}%;background:${col}"></i></div>
      ${b.over>0?`<div class="over-txt">Over by ${full(b.over)}</div>`:''}
    </div>`;
  }).join('');

  const worst = S.budgets.slice().sort((a,b) => b.pct - a.pct)[0];
  return `<div class="grid g3">${cards}</div>
  <div class="grid g2">
    <div class="card"><h3>Category limits &middot; ${S.period}</h3>${bars}</div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card"><h3>Weekly Spend</h3><canvas id="bars" height="200"></canvas></div>
      <div class="card" style="background:#F5F3FF;border-color:#DDD6FE">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <div class="tile" style="background:#EDE9FE">&#10024;</div>
          <div><h3 style="color:#7C3AED">AI Insight</h3>
          <p style="font-size:14px;line-height:1.6;margin-top:8px">
          ${worst ? `<b>${esc(worst.category)}</b> đang ở mức <b>${worst.pct}%</b> ngân sách.
          ${worst.over>0 ? 'Bạn đã vượt giới hạn — hãy tạm dừng chi mục này đến cuối tháng.' : 'Vẫn nằm trong kiểm soát, tiếp tục giữ nhịp nhé!'}` : ''}
          </p></div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- Goals ---------- */
function vGoals(){
  const saved = S.goals.reduce((s,g) => s + g.saved, 0);
  const target = S.goals.reduce((s,g) => s + g.target, 0);
  const done = S.goals.filter(g => g.saved >= g.target).length;
  const monthly = Math.max(1, S.kpi.income - S.kpi.expense);

  const cards = S.goals.map(g => {
    const pct = Math.min(100, Math.round(g.saved / g.target * 100));
    const remain = Math.max(0, g.target - g.saved);
    const months = Math.max(1, Math.round(remain / monthly));
    return `<div class="card goal" style="--c:${g.accent}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="tile" style="background:${g.accent}22;font-size:24px;width:52px;height:52px">${g.icon}</div>
        ${remain===0 ? '<span class="badge" style="background:#D1FAE5;color:#059669">COMPLETE &#10004;</span>'
                     : `<span class="pct">${pct}%</span>`}
      </div>
      <div class="nm">${esc(g.name)}</div>
      <div class="dl">Deadline: ${esc(g.deadline)}</div>
      <div class="bar" style="margin-top:16px"><i style="width:${pct}%;background:${g.accent};box-shadow:0 0 10px ${g.accent}66"></i></div>
      <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:13px">
        <span style="color:var(--muted)">Saved: <b style="color:var(--text)">${money(g.saved)}</b></span>
        <span style="color:var(--muted)">Target: <b style="color:var(--text)">${money(g.target)}</b></span>
      </div>
      <div class="note" style="background:${g.accent}14;color:${g.accent}">
        ${remain===0 ? '&#127881; Goal achieved! Great work, ' + esc(S.user.name) + '.'
                     : `<b>${money(remain)}</b> to go &middot; ~${months} tháng`}
      </div>
      ${remain===0 ? '' : `<button class="btn ghost" style="width:100%;margin-top:12px" onclick="deposit(${g.id})">+ Nạp tiền vào mục tiêu</button>`}
    </div>`;
  }).join('');

  return `<div class="goal-banner">
      <div><div class="t">Total Saved Across Goals</div><div class="v">${money(saved)}</div></div>
      <div style="text-align:right"><div class="t">of ${money(target)}</div>
      <div class="pill" style="margin-top:8px">&#127942; ${done} goal completed</div></div>
    </div>
    <div class="grid g3">${cards}</div>`;
}

/* ---------- AI Coach ---------- */
function vCoach(){
  const NC = {warn:['#F59E0B','#FFFBEB'], ai:['#A78BFA','#F5F3FF'], done:['#34D399','#ECFDF5']};
  const notes = S.notifications.map(n => `
    <div class="note-item" style="--c:${NC[n.kind][0]};--b:${NC[n.kind][1]}">
      ${esc(n.text)}<small>${esc(n.ago)}</small></div>`).join('');
  const prompts = ['&#128202; Tháng này tôi tiêu thế nào?','&#127919; Mục tiêu nào gần đạt nhất?','&#128176; Ngân sách nào sắp vượt?','&#127974; Số dư các tài khoản?']
    .map(p => `<button class="qp" onclick="quick(this)">${p}</button>`).join('');
  const msgs = chat.map(m => `
    <div class="msg ${m.from==='me'?'me':'ai'}">
      <div class="mini">${m.from==='me'?S.user.initials:'&#10024;'}</div>
      <div class="bubble">${esc(m.text)}</div></div>`).join('');

  return `<div class="chat-wrap">
    <div class="card chat">
      <div class="msgs" id="msgs">${msgs}</div>
      <div class="composer">
        <input id="chatInput" placeholder="Hỏi bất cứ điều gì về tài chính của bạn...">
        <button class="btn" onclick="send()">Send &uarr;</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card"><h3>Notifications</h3><div style="margin-top:14px">${notes}</div></div>
      <div class="card"><h3>Quick Prompts</h3><div style="margin-top:14px">${prompts}</div></div>
    </div>
  </div>`;
}

/* ---------- after render ---------- */
function after(){
  const sb = $('#searchBox');
  if(sb){ sb.oninput = e => { search = e.target.value; const p = e.target.selectionStart; render(); const n = $('#searchBox'); n.focus(); n.setSelectionRange(p,p); }; }

  const donut = $('#donut');
  if(donut){
    const d = S.charts.by_category;
    charts.push(new Chart(donut, {
      type:'doughnut',
      data:{labels:Object.keys(d), datasets:[{data:Object.values(d),
        backgroundColor:['#0D9488','#A78BFA','#F87171','#34D399','#FBBF24','#60A5FA'], borderWidth:0}]},
      options:{cutout:'62%', plugins:{legend:{position:'right',labels:{boxWidth:10,font:{family:'Plus Jakarta Sans',size:12},color:'#334155'}}}}
    }));
  }
  const bars = $('#bars');
  if(bars){
    const w = S.charts.weekly;
    const mx = Math.max(...w);
    charts.push(new Chart(bars, {
      type:'bar',
      data:{labels:['Wk 1','Wk 2','Wk 3','Wk 4'], datasets:[{data:w,
        backgroundColor:w.map(v => v===mx?'#F87171':'#2DA89C'), borderRadius:6, barThickness:36}]},
      options:{plugins:{legend:{display:false}},
        scales:{y:{beginAtZero:true,grid:{color:'#F1F5F9'},ticks:{callback:v=>fmtVND(v),color:'#94A3B8'}},
                x:{grid:{display:false},ticks:{color:'#94A3B8'}}}}
    }));
  }
  const m = $('#msgs'); if(m) m.scrollTop = m.scrollHeight;
}

/* ---------- actions ---------- */
window.goTab = t => { tab = t; [...$('#nav').children].forEach(x => x.classList.toggle('active', x.dataset.tab===t)); render(); };
window.delTxn = async id => {
  if(!confirm('Xoá giao dịch này? Số dư tài khoản sẽ được hoàn lại.')) return;
  const r = await fetch('/api/transactions/'+id, {method:'DELETE'});
  S = await r.json(); render();
};
window.deposit = async id => {
  const v = prompt('Nạp bao nhiêu vào mục tiêu này? (VND)', '500000');
  if(!v) return;
  try{ S = await post('/api/goals/'+id+'/deposit', {amount:v}); render(); }
  catch(e){ alert(e.message); }
};
window.exportCSV = () => {
  const rows = [['Date','Merchant','Category','Account','Amount']].concat(
    S.transactions.map(t => [t.date, t.merchant, t.category, t.account, t.amount]));
  const csv = rows.map(r => r.map(c => '"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'budget-buddy-transactions.csv'; a.click();
};
window.quick = b => { $('#chatInput').value = b.textContent.trim(); send(); };
window.send = async () => {
  const inp = $('#chatInput'); const text = inp.value.trim(); if(!text) return;
  chat.push({from:'me', text}); inp.value = ''; render();
  const d = await post('/api/coach', {message:text});
  chat.push({from:'ai', text:d.reply}); render();
};
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && document.activeElement && document.activeElement.id === 'chatInput') send();
  if(e.key === 'Escape') closeModal();
});

/* ---------- modal ---------- */
function fillSelects(){
  const cats = S.categories.filter(c => c.kind === txnType);
  $('#fCat').innerHTML = cats.map(c => `<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join('');
  $('#fAcc').innerHTML = S.accounts.map(a => `<option value="${a.id}">${a.icon} ${esc(a.name)} — ${full(a.balance)}</option>`).join('');
  updatePreview();
}
function updatePreview(){
  const acc = S.accounts.find(a => a.id == $('#fAcc').value);
  const amt = parseInt($('#fAmount').value || 0, 10);
  if(!acc){ $('#preview').textContent = ''; return; }
  const after = acc.balance + (txnType === 'income' ? amt : -amt);
  $('#preview').innerHTML = `Số dư <b>${esc(acc.name)}</b> sau giao dịch: ` +
    `<b style="color:${after < 0 ? '#DC2626' : '#059669'}">${full(after)}</b>` +
    (after < 0 ? ' &nbsp;&#9888;&#65039; không đủ số dư' : '');
}
function openModal(){
  $('#fDate').value = S.period + '-' + String(new Date().getDate()).padStart(2,'0');
  $('#fMerchant').value = ''; $('#fAmount').value = ''; $('#err').textContent = '';
  setType('expense'); $('#overlay').classList.add('open'); $('#fMerchant').focus();
}
function closeModal(){ $('#overlay').classList.remove('open'); }
function setType(t){
  txnType = t;
  $('#tExp').classList.toggle('on', t === 'expense');
  $('#tInc').classList.toggle('on', t === 'income');
  fillSelects();
}
$('#openModal').onclick = openModal;
$('#cancelBtn').onclick = closeModal;
$('#tExp').onclick = () => setType('expense');
$('#tInc').onclick = () => setType('income');
$('#fAcc').onchange = updatePreview;
$('#fAmount').oninput = updatePreview;
$('#overlay').onclick = e => { if(e.target === $('#overlay')) closeModal(); };
$('#saveBtn').onclick = async () => {
  $('#err').textContent = '';
  try{
    S = await post('/api/transactions', {
      merchant: $('#fMerchant').value,
      amount:   $('#fAmount').value,
      date:     $('#fDate').value,
      type:     txnType,
      category_id: parseInt($('#fCat').value, 10),
      account_id:  parseInt($('#fAcc').value, 10),
    });
    closeModal(); goTab('transactions');
  }catch(e){ $('#err').textContent = e.message; }
};

load();
</script>
</body>
</html>
